[package]
name = "medialibrary-browser"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "medialibrary_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.33"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2.9.0"

#
tauri-plugin-medialibrary = { version = "0.18.0" }
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
tauri-plugin-medialibrary = { version = "0.18.0", features = ["amt"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-medialibrary = { version = "0.18.0", features = ["thumb_cache"] }


#for development (you have to comment the above lines and use the following lines)
# [target.'cfg(all(unix, target_os = "android"))'.dependencies]
# tauri-plugin-medialibrary = { path = "../../tauri-plugin-medialibrary"  }

